<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 746" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e4f4"/>
      <stop offset="1" stop-color="#cad9ef"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#9aa6bd" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer background -->
  <rect width="1340" height="746" fill="#e3e7ef"/>

  <!-- Window card -->
  <rect x="28" y="32" width="1252" height="676" rx="26" fill="#f5f8fc" filter="url(#soft)"/>

  <!-- Title-bar dots -->
  <circle cx="88" cy="84" r="22" fill="#6b7493"/>
  <circle cx="150" cy="84" r="22" fill="#9fb0ce"/>
  <circle cx="212" cy="84" r="22" fill="#c3d7ea"/>

  <!-- Inner panel -->
  <rect x="70" y="130" width="1168" height="520" rx="30" fill="url(#panel)"/>

  <!-- Chevrons -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 330 L12 373 L34 416"/>
    <path d="M1306 330 L1328 373 L1306 416"/>
  </g>
</svg>
